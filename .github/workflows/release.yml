name: Build and release

on:
  push:
    branches: [main, claude/awesome-maxwell-0fhm39]
    paths: ["src/**", "ui/**", "assets/**", "Cargo.toml", "Cargo.lock", "scripts/**", ".cargo/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-linux-musl
      - name: Zig (C compiler for ring)
        run: pip install ziglang
      - name: Tests
        run: cargo test --locked
      - name: Build aarch64-musl
        run: ./scripts/build.sh
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/aarch64-unknown-linux-musl/release/baristore baristore-aarch64
          sha256sum baristore-aarch64 > baristore-aarch64.sha256
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "BariStore nightly" \
              --notes "Built by CI from ${GITHUB_SHA}. Install in Open Minis: see the README." --target "${GITHUB_SHA}"
          gh release upload nightly baristore-aarch64 baristore-aarch64.sha256 --clobber
          gh release edit nightly --notes "Built by CI from ${GITHUB_SHA} on $(date -u +%Y-%m-%d). Install in Open Minis: see the README."
