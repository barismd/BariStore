name: Build and release

on:
  push:
    branches: [main]
    paths: ["src/**", "ui/**", "assets/**", "Cargo.toml", "Cargo.lock", "scripts/**", ".cargo/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-linux-musl
      - name: Zig (C compiler for ring)
        run: pip install ziglang
      - name: Tests
        run: cargo test --locked
      - name: Build aarch64-musl
        run: ./scripts/build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/aarch64-unknown-linux-musl/release/baristore baristore-aarch64
          sha256sum baristore-aarch64 > baristore-aarch64.sha256
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          notes="Built by CI from ${GITHUB_SHA} on $(date -u +%Y-%m-%d). Install: https://barismd.github.io/BariStore/"
          # v<version>: one release per version. A stable one becomes the
          # latest release (install.sh and "baristore update" download it);
          # alpha/beta/rc are prereleases.
          kind="--latest"; case "$version" in *-*) kind="--prerelease";; esac
          gh release view "v$version" >/dev/null 2>&1 || \
            gh release create "v$version" $kind --title "BariStore $version" --notes "$notes" --target "${GITHUB_SHA}"
          gh release upload "v$version" baristore-aarch64 baristore-aarch64.sha256 --clobber
